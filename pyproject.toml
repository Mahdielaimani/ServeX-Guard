[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servex-guard"
version = "0.3.0"
description = "Production quality gate for RAG systems — evaluate, protect, monitor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "El Mahdi El Aimani", email = "mahdielaimani@gmail.com" },
]
keywords = [
    "rag", "llm", "quality", "security", "pii", "prompt-injection",
    "evaluation", "ragas", "llmops", "mlops", "ci-cd", "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]

# Deps pinned to exact versions (==) where the wheel is available across all
# supported Python versions, for supply-chain safety. numpy uses a bounded
# range because numpy 2.4.x requires Python >=3.11; the floor keeps 3.10
# support. See SECURITY.md → Dependency security.
# Core deps only — basic usage (injection scan + PII regex fallback) works
# fully offline with no heavy ML deps. RAGAS/Presidio are optional extras
# with graceful fallback. See .devnotes.md → graceful degradation.
dependencies = [
    "typer==0.21.1",
    "rich==14.3.1",
    "pydantic==2.13.3",
    "numpy>=1.26,<3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# RAGAS quality evaluation (faithfulness, relevancy, context recall).
# LangChain is capped on purpose: RAGAS 0.4.3 imports modules that
# langchain-community 0.4 removed, so an uncapped install fails at import.
eval = [
    "ragas==0.4.3",
    "datasets>=2.19,<6",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
]
# Microsoft Presidio PII detection. spaCy language models are installed
# separately and never downloaded at runtime: see security._build_analyzer.
pii = [
    # 2.2.366 dropped Python 3.10, so the floor stays below it.
    "presidio-analyzer>=2.2.363,<2.3",
    "presidio-anonymizer>=2.2.363,<2.3",
]
# Everything: full quality + security stack
all = [
    "servex-guard[eval,pii]",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]
azure = [
    "azure-identity==1.19.0",
    "openai==1.57.4",
]

[project.scripts]
servexguard = "servexguard.cli:app"

[project.urls]
Homepage = "https://github.com/Mahdielaimani/ServeX-Guard"
Documentation = "https://github.com/Mahdielaimani/ServeX-Guard#readme"
Repository = "https://github.com/Mahdielaimani/ServeX-Guard"
Issues = "https://github.com/Mahdielaimani/ServeX-Guard/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["servexguard"]
include = ["servexguard/py.typed"]

# Keep assets/ in the git repo (GitHub display) but out of the PyPI sdist.
# The README logo is referenced by absolute raw.githubusercontent URL, so it
# renders on both GitHub and PyPI without bundling the 1.4MB image.
[tool.hatch.build.targets.sdist]
exclude = [
    "assets/",
    ".github/",
    ".deepeval/",
]
