name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check servexguard/ tests/

      - name: Type check
        run: mypy servexguard/ --ignore-missing-imports
        continue-on-error: true

      - name: Test
        run: pytest tests/ -v --cov=servexguard --cov-report=term-missing --cov-fail-under=60

      # Dogfooding: ServeXGuard tests itself
      - name: 🛡️ ServeXGuard Self-Check (injection scan only)
        run: |
          servexguard check \
            --dataset examples/golden_dataset.jsonl \
            --check-injection \
            --min-faithfulness 0.0 \
            --min-relevancy 0.0 \
            --min-context-recall 0.0
