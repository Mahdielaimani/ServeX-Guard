name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check servexguard/ tests/

      - name: Type check
        run: mypy servexguard/ --ignore-missing-imports
        continue-on-error: true

      - name: Test
        run: pytest tests/ -v --cov=servexguard --cov-report=term-missing --cov-fail-under=60

      # Dogfooding: ServeXGuard tests itself
      - name: 🛡️ ServeXGuard Self-Check (injection scan only)
        run: |
          servexguard check \
            --dataset examples/golden_dataset.jsonl \
            --check-injection \
            --min-faithfulness 0.0 \
            --min-relevancy 0.0 \
            --min-context-recall 0.0

  # The job above replaces RAGAS with a fake, so it stayed green while 0.2.1 could
  # not even import it. This one installs what a user installs, from a built
  # wheel, and runs the real stacks.
  extras:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: windows-latest
            python-version: "3.12"
            experimental: false
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel and install it with every extra
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install "$(ls dist/*.whl | sort -V | tail -1)[all]"
          pip install pytest pytest-asyncio

      - name: Install the spaCy models the tests use
        run: |
          python -m spacy download fr_core_news_sm
          python -m spacy download en_core_web_sm

      - name: Test against the real RAGAS and Presidio
        # From a directory without the source tree, so the installed wheel is what runs.
        shell: bash
        run: |
          mkdir -p ../real-stack && cp -r tests ../real-stack/tests && cd ../real-stack
          set -o pipefail
          pytest tests/test_ragas_integration.py tests/test_presidio_integration.py \
            -v -p no:cacheprovider -rs | tee summary.txt
          # Skipping here would hide exactly the failure this job exists to catch.
          if grep -E "SKIPPED.*(could not import|not installed)" summary.txt; then
            echo "A real-stack test was skipped."; exit 1
          fi

      - name: The installed gate refuses to pass with nothing measured
        shell: bash
        run: |
          printf '{"question":"q","answer":"a","contexts":["c"],"ground_truth":"g"}\n' > d.jsonl
          set +e
          servexguard check --dataset d.jsonl
          code=$?
          set -e
          test "$code" = "3"
